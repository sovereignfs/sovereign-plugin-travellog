<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1000" height="640" fill="#fafafa"/>
  <rect width="1000" height="640" fill="#18181b" opacity="0.35"/>

  <!-- Dialog (Dialog size="md") -->
  <rect x="300" y="100" width="400" height="470" rx="14" fill="#ffffff"/>
  <text x="332" y="156" font-size="18" font-weight="700" fill="#18181b">Share "Lisbon Weekend"</text>
  <text x="668" y="154" font-size="16" fill="#a1a1aa" text-anchor="end">×</text>

  <rect x="332" y="180" width="336" height="38" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="344" y="204" font-size="13" fill="#a1a1aa">Search people by name or email…</text>

  <!-- search result row -->
  <rect x="332" y="228" width="336" height="52" rx="8" fill="#f4f4f5"/>
  <circle cx="356" cy="254" r="14" fill="#ffffff"/>
  <text x="356" y="259" font-size="11" text-anchor="middle" fill="#52525b">AS</text>
  <text x="380" y="250" font-size="13" fill="#18181b">Aiko Sato</text>
  <text x="380" y="266" font-size="11" fill="#71717a">aiko@example.com</text>
  <rect x="596" y="242" width="58" height="28" rx="8" fill="#18181b"/>
  <text x="610" y="260" font-size="12" fill="#ffffff">Add</text>

  <text x="332" y="316" font-size="12" font-weight="600" fill="#52525b">PEOPLE WITH ACCESS</text>
  <line x1="332" y1="326" x2="668" y2="326" stroke="#e4e4e7"/>

  <circle cx="348" cy="358" r="14" fill="#e4e4e7"/>
  <text x="348" y="363" font-size="11" text-anchor="middle" fill="#52525b">JF</text>
  <text x="372" y="354" font-size="13" fill="#18181b">Jamie Fox (you)</text>
  <text x="372" y="370" font-size="11" fill="#71717a">Owner</text>

  <circle cx="348" cy="402" r="14" fill="#e4e4e7"/>
  <text x="348" y="407" font-size="11" text-anchor="middle" fill="#52525b">TK</text>
  <text x="372" y="398" font-size="13" fill="#18181b">Tom Kelly</text>
  <text x="372" y="414" font-size="11" fill="#71717a">Member</text>
  <text x="668" y="402" font-size="12" fill="#a1a1aa" text-anchor="end">Remove</text>

  <rect x="332" y="476" width="336" height="1" fill="#f4f4f5"/>
  <text x="332" y="500" font-size="11" fill="#a1a1aa">Members can view and edit this trip's stops and itinerary.</text>
  <text x="332" y="516" font-size="11" fill="#a1a1aa">Only you, as owner, can add or remove people.</text>

  <rect x="586" y="534" width="82" height="32" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="602" y="555" font-size="13" fill="#52525b">Done</text>

  <!-- Annotations -->
  <text x="300" y="580" font-size="12" fill="#a1a1aa">Direct copy of sovereign-plugin-docs' FolderShareDialog pattern — sdk.directory search,</text>
  <text x="300" y="598" font-size="12" fill="#a1a1aa">not a plugin-local reimplementation. Assumes real shared trip access (open question 2, not yet confirmed).</text>
</svg>
