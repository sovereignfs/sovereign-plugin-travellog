<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="760" fill="#fafafa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="760" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="760" stroke="#e4e4e7"/>
  <rect x="16" y="16" width="248" height="36" rx="8" fill="#18181b"/>
  <text x="32" y="39" font-size="14" font-weight="600" fill="#ffffff">Trips</text>
  <text x="32" y="79" font-size="14" fill="#52525b">Check-ins</text>
  <text x="32" y="119" font-size="14" fill="#52525b">Planner</text>

  <!-- Main column (card list, unchanged from screen 3 — omitted detail for brevity) -->
  <text x="300" y="52" font-size="24" font-weight="700" fill="#18181b">Trips</text>
  <g>
    <rect x="300" y="76" width="500" height="100" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <text x="316" y="98" font-size="12" fill="#71717a">Upcoming</text>
    <text x="316" y="120" font-size="15" font-weight="600" fill="#18181b">Kyoto &amp; Osaka</text>
    <text x="316" y="140" font-size="12" fill="#71717a">Sep 2–4 · 3 days · 1 stop</text>
  </g>

  <!-- Detail column — matches TripDetailPanel.tsx's REAL current layout (Badge, icon meta rows, "With" companions field), not the deferred share-dialog mockup in screen 3 -->
  <rect x="840" y="0" width="360" height="760" fill="#ffffff"/>
  <line x1="840" y1="0" x2="840" y2="760" stroke="#e4e4e7"/>

  <text x="864" y="48" font-size="18" font-weight="700" fill="#18181b">Kyoto &amp; Osaka</text>
  <text x="1160" y="46" font-size="16" fill="#a1a1aa" text-anchor="end">×</text>

  <rect x="864" y="68" width="76" height="24" rx="6" fill="#f4f4f5"/>
  <text x="878" y="84" font-size="11" fill="#18181b">Upcoming</text>

  <text x="864" y="126" font-size="13" fill="#52525b">📅 Sep 2 – Sep 4, 2026</text>
  <text x="864" y="152" font-size="13" fill="#52525b">📍 1 stop</text>
  <text x="864" y="178" font-size="13" fill="#52525b">📚 3 days</text>

  <text x="864" y="216" font-size="12" fill="#71717a">With</text>
  <rect x="864" y="226" width="312" height="36" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="874" y="234" width="52" height="20" rx="10" fill="#f4f4f5"/>
  <text x="884" y="248" font-size="11" fill="#18181b">Sam ×</text>

  <line x1="864" y1="284" x2="1176" y2="284" stroke="#f4f4f5"/>

  <!-- NEW: Attachments section -->
  <text x="864" y="312" font-size="13" font-weight="600" fill="#18181b">Attachments</text>

  <g>
    <rect x="864" y="324" width="312" height="52" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="880" y="346" font-size="13" fill="#52525b">📄</text>
    <text x="900" y="345" font-size="13" font-weight="600" fill="#18181b">Flight confirmation.pdf</text>
    <text x="900" y="361" font-size="11" fill="#a1a1aa">Booking</text>
    <text x="1160" y="354" font-size="13" fill="#a1a1aa" text-anchor="end">🗑</text>
  </g>
  <g>
    <rect x="864" y="384" width="312" height="52" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="880" y="406" font-size="13" fill="#52525b">🧾</text>
    <text x="900" y="405" font-size="13" font-weight="600" fill="#18181b">Hotel receipt.jpg</text>
    <text x="900" y="421" font-size="11" fill="#a1a1aa">Receipt</text>
    <text x="1160" y="414" font-size="13" fill="#a1a1aa" text-anchor="end">🗑</text>
  </g>

  <rect x="864" y="452" width="140" height="30" rx="8" fill="none" stroke="#d4d4d8" stroke-dasharray="4 3"/>
  <text x="884" y="472" font-size="12" fill="#52525b">+ Add attachment</text>

  <line x1="864" y1="504" x2="1176" y2="504" stroke="#f4f4f5"/>

  <rect x="864" y="524" width="312" height="36" rx="8" fill="#18181b"/>
  <text x="1020" y="547" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Open in Planner →</text>

  <!-- Annotations -->
  <text x="864" y="612" font-size="12" fill="#a1a1aa">Reflects the real, currently-shipped panel (T.14) — icon meta</text>
  <text x="864" y="630" font-size="12" fill="#a1a1aa">rows + companions field — not the deferred sdk.directory</text>
  <text x="864" y="648" font-size="12" fill="#a1a1aa">sharing mockup in screen 3.</text>
  <text x="864" y="678" font-size="12" fill="#a1a1aa">"+ Add attachment" reveals an inline composer in place (same</text>
  <text x="864" y="696" font-size="12" fill="#a1a1aa">reveal pattern as Kanban's QuickAddCard): a kind select</text>
  <text x="864" y="714" font-size="12" fill="#a1a1aa">(Receipt/Booking/Accommodation/Other), a title field pre-filled</text>
  <text x="864" y="732" font-size="12" fill="#a1a1aa">from the picked filename, a FileDropzone, Add/Cancel.</text>
  <text x="300" y="612" font-size="12" fill="#a1a1aa">No empty-state illustration for zero attachments — just the</text>
  <text x="300" y="630" font-size="12" fill="#a1a1aa">"+ Add attachment" row with no cards above it (same "populated</text>
  <text x="300" y="648" font-size="12" fill="#a1a1aa">list with fewer rows" shape as every other list here).</text>
  <text x="300" y="678" font-size="12" fill="#a1a1aa">Trip-level only (attachments.trip_id) — not per-day. CONCEPT.md</text>
  <text x="300" y="696" font-size="12" fill="#a1a1aa">scopes this panel to "basic" trip detail; per-day attachments</text>
  <text x="300" y="714" font-size="12" fill="#a1a1aa">stay schema-supported but unexposed until a task actually needs them.</text>
</svg>
