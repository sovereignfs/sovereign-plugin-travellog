<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="620" fill="#fafafa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="620" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="620" stroke="#e4e4e7"/>
  <rect x="16" y="16" width="248" height="36" rx="8" fill="#18181b"/>
  <text x="32" y="39" font-size="14" font-weight="600" fill="#ffffff">Trips</text>
  <text x="32" y="79" font-size="14" fill="#52525b">Check-ins</text>
  <text x="32" y="119" font-size="14" fill="#52525b">Planner</text>

  <!-- Main column (narrowed to 560px now the detail column is open) -->
  <text x="300" y="52" font-size="24" font-weight="700" fill="#18181b">Trips</text>
  <g>
    <rect x="300" y="76" width="500" height="100" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="316" y="98" font-size="12" fill="#71717a">Planning</text>
    <text x="316" y="120" font-size="15" font-weight="600" fill="#18181b">Kyoto &amp; Osaka</text>
    <text x="316" y="140" font-size="12" fill="#71717a">Dates not set yet · 3 stops planned</text>
  </g>
  <g>
    <rect x="300" y="188" width="500" height="100" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <text x="316" y="210" font-size="12" fill="#71717a">Ongoing</text>
    <text x="316" y="232" font-size="15" font-weight="600" fill="#18181b">Lisbon Weekend</text>
    <text x="316" y="252" font-size="12" fill="#71717a">Aug 26–30 · day 3 of 5 · 2 stops</text>
  </g>

  <!-- Detail column -->
  <rect x="840" y="0" width="360" height="620" fill="#ffffff"/>
  <line x1="840" y1="0" x2="840" y2="620" stroke="#e4e4e7"/>

  <text x="864" y="48" font-size="18" font-weight="700" fill="#18181b">Lisbon Weekend</text>
  <text x="1160" y="46" font-size="16" fill="#a1a1aa" text-anchor="end">×</text>
  <rect x="864" y="60" width="66" height="22" rx="11" fill="#18181b"/>
  <text x="876" y="75" font-size="11" fill="#ffffff">Ongoing</text>

  <line x1="864" y1="96" x2="1176" y2="96" stroke="#f4f4f5"/>

  <text x="864" y="126" font-size="11" fill="#a1a1aa">DATES</text>
  <text x="864" y="146" font-size="14" fill="#18181b">Aug 26 – Aug 30, 2026</text>

  <text x="864" y="176" font-size="11" fill="#a1a1aa">STOPS</text>
  <text x="864" y="196" font-size="14" fill="#18181b">Lisbon, Porto (2)</text>

  <text x="864" y="226" font-size="11" fill="#a1a1aa">DAYS</text>
  <text x="864" y="246" font-size="14" fill="#18181b">5</text>

  <line x1="864" y1="270" x2="1176" y2="270" stroke="#f4f4f5"/>

  <text x="864" y="298" font-size="13" font-weight="600" fill="#18181b">Shared with</text>
  <rect x="1090" y="282" width="86" height="28" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1104" y="300" font-size="12" fill="#18181b">+ Share</text>

  <circle cx="876" cy="332" r="14" fill="#e4e4e7"/>
  <text x="876" y="337" font-size="11" text-anchor="middle" fill="#52525b">JF</text>
  <text x="900" y="330" font-size="13" fill="#18181b">Jamie Fox</text>
  <text x="900" y="346" font-size="11" fill="#a1a1aa">Owner</text>

  <circle cx="876" cy="376" r="14" fill="#e4e4e7"/>
  <text x="876" y="381" font-size="11" text-anchor="middle" fill="#52525b">You</text>
  <text x="900" y="374" font-size="13" fill="#18181b">You</text>
  <text x="900" y="390" font-size="11" fill="#a1a1aa">Member</text>
  <text x="1176" y="374" font-size="12" fill="#a1a1aa" text-anchor="end">Remove</text>

  <line x1="864" y1="418" x2="1176" y2="418" stroke="#f4f4f5"/>

  <text x="864" y="448" font-size="13" font-weight="600" fill="#18181b">Open in Planner →</text>

  <!-- Annotations -->
  <text x="864" y="560" font-size="12" fill="#a1a1aa">Detail column is intentionally basic — no full itinerary</text>
  <text x="864" y="578" font-size="12" fill="#a1a1aa">here (the full trip-details page is deferred). "Open in</text>
  <text x="864" y="596" font-size="12" fill="#a1a1aa">Planner" is the only way to see/edit the day-by-day plan.</text>
  <text x="300" y="592" font-size="12" fill="#a1a1aa">Selected card gets a solid border + left accent bar; clicking</text>
  <text x="300" y="610" font-size="12" fill="#a1a1aa">elsewhere on a card (not its CTA) selects it, replacing the detail column's contents.</text>
</svg>
