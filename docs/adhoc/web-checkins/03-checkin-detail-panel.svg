<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="600" fill="#fafafa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="600" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="600" stroke="#e4e4e7"/>
  <text x="32" y="39" font-size="14" fill="#52525b">Trips</text>
  <rect x="16" y="56" width="248" height="36" rx="8" fill="#18181b"/>
  <text x="32" y="79" font-size="14" font-weight="600" fill="#ffffff">Check-ins</text>
  <text x="32" y="119" font-size="14" fill="#52525b">Planner</text>

  <!-- Main (narrowed to 560px) -->
  <text x="300" y="52" font-size="24" font-weight="700" fill="#18181b">Check-ins</text>

  <text x="300" y="106" font-size="13" font-weight="600" fill="#71717a">YESTERDAY</text>
  <g>
    <rect x="300" y="116" width="540" height="56" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <rect x="312" y="128" width="32" height="32" rx="8" fill="#e4e4e7"/>
    <text x="360" y="140" font-size="14" font-weight="600" fill="#18181b">Belém Tower</text>
    <text x="360" y="158" font-size="12" fill="#71717a">Landmark · 3:15 PM</text>
  </g>
  <g>
    <rect x="300" y="180" width="540" height="56" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="312" y="192" width="32" height="32" rx="8" fill="#f4f4f5"/>
    <text x="360" y="204" font-size="14" font-weight="600" fill="#18181b">Pastéis de Belém</text>
    <text x="360" y="222" font-size="12" fill="#71717a">Bakery · 3:50 PM</text>
  </g>

  <!-- Detail column -->
  <rect x="840" y="0" width="360" height="600" fill="#ffffff"/>
  <line x1="840" y1="0" x2="840" y2="600" stroke="#e4e4e7"/>

  <rect x="864" y="28" width="336" height="150" rx="10" fill="#e4e4e7"/>
  <text x="1032" y="108" font-size="11" text-anchor="middle" fill="#71717a">photo</text>
  <text x="1160" y="46" font-size="16" fill="#a1a1aa" text-anchor="end">×</text>

  <text x="864" y="204" font-size="18" font-weight="700" fill="#18181b">Belém Tower</text>
  <text x="864" y="224" font-size="12" fill="#71717a">Landmark · Aug 27, 3:15 PM</text>

  <line x1="864" y1="244" x2="1176" y2="244" stroke="#f4f4f5"/>

  <text x="864" y="270" font-size="11" fill="#a1a1aa">NOTE</text>
  <text x="864" y="290" font-size="13" fill="#18181b">Line for the tower was long — worth it</text>
  <text x="864" y="308" font-size="13" fill="#18181b">for the river view at the top.</text>

  <text x="864" y="338" font-size="11" fill="#a1a1aa">WITH</text>
  <text x="864" y="358" font-size="13" fill="#18181b">Tom Kelly</text>

  <line x1="864" y1="380" x2="1176" y2="380" stroke="#f4f4f5"/>

  <text x="864" y="406" font-size="11" fill="#a1a1aa">TRIP</text>
  <rect x="864" y="414" width="140" height="26" rx="13" fill="#f4f4f5"/>
  <text x="878" y="431" font-size="12" fill="#18181b">Lisbon Weekend</text>
  <text x="1176" y="431" font-size="12" fill="#a1a1aa" text-anchor="end">Unlink</text>

  <!-- Annotations -->
  <text x="864" y="480" font-size="12" fill="#a1a1aa">"Unlink" clears trip_id and sets link_source: null —</text>
  <text x="864" y="498" font-size="12" fill="#a1a1aa">a later auto-link recompute for this trip will never</text>
  <text x="864" y="516" font-size="12" fill="#a1a1aa">re-attach it (manual override always wins).</text>
  <text x="300" y="560" font-size="12" fill="#a1a1aa">A check-in with no trip link shows no TRIP section at all in the detail column (not an empty one).</text>
</svg>
