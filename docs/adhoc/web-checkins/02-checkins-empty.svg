<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="500" fill="#fafafa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="500" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="500" stroke="#e4e4e7"/>
  <text x="32" y="39" font-size="14" fill="#52525b">Trips</text>
  <rect x="16" y="56" width="248" height="36" rx="8" fill="#18181b"/>
  <text x="32" y="79" font-size="14" font-weight="600" fill="#ffffff">Check-ins</text>
  <text x="32" y="119" font-size="14" fill="#52525b">Planner</text>

  <!-- Page header -->
  <text x="300" y="52" font-size="24" font-weight="700" fill="#18181b">Check-ins</text>
  <rect x="1076" y="28" width="124" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="1096" y="51" font-size="14" fill="#18181b">Import…</text>

  <!-- Empty state -->
  <circle cx="600" cy="220" r="34" fill="#f4f4f5"/>
  <text x="600" y="230" font-size="26" text-anchor="middle" fill="#a1a1aa">📍</text>
  <text x="600" y="288" font-size="17" font-weight="600" text-anchor="middle" fill="#18181b">Nothing checked in yet</text>
  <text x="600" y="310" font-size="13" text-anchor="middle" fill="#71717a">Check in from your phone as you go, or bring in your</text>
  <text x="600" y="328" font-size="13" text-anchor="middle" fill="#71717a">history from Swarm to start with years of it already here.</text>
  <rect x="480" y="346" width="120" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="500" y="369" font-size="14" fill="#18181b">Import data</text>
  <rect x="612" y="346" width="108" height="36" rx="8" fill="#f4f4f5"/>
  <text x="628" y="369" font-size="13" fill="#71717a">Get the app</text>

  <!-- Annotations -->
  <text x="300" y="440" font-size="12" fill="#a1a1aa">Two escape hatches, since web can't create a check-in: import existing history, or get the mobile app.</text>
</svg>
