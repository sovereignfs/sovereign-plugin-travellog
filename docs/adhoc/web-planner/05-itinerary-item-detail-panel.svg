<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="640" fill="#fafafa"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="280" height="640" fill="#f4f4f5"/>
  <line x1="280" y1="0" x2="280" y2="640" stroke="#e4e4e7"/>
  <text x="32" y="39" font-size="14" fill="#52525b">Trips</text>
  <text x="32" y="79" font-size="14" fill="#52525b">Check-ins</text>
  <rect x="16" y="96" width="248" height="36" rx="8" fill="#18181b"/>
  <text x="32" y="119" font-size="14" font-weight="600" fill="#ffffff">Planner</text>

  <!-- Main (narrowed to 560px) -->
  <text x="300" y="42" font-size="12" fill="#a1a1aa">← Planner</text>
  <text x="300" y="76" font-size="22" font-weight="700" fill="#18181b">Lisbon Weekend</text>

  <text x="300" y="120" font-size="15" font-weight="700" fill="#18181b">Day 1 · Tue, Aug 26</text>
  <g>
    <rect x="300" y="132" width="540" height="52" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="316" y="164" font-size="13" font-weight="600" fill="#18181b">09:00</text>
    <text x="380" y="158" font-size="14" font-weight="600" fill="#18181b">Belém Tower</text>
    <text x="380" y="174" font-size="12" fill="#71717a">Landmark</text>
  </g>
  <g>
    <rect x="300" y="192" width="540" height="52" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <text x="316" y="224" font-size="13" font-weight="600" fill="#18181b">13:00</text>
    <text x="380" y="218" font-size="14" font-weight="600" fill="#18181b">Time Out Market</text>
    <text x="380" y="234" font-size="12" fill="#71717a">Food hall · reservation</text>
    <rect x="768" y="206" width="56" height="22" rx="11" fill="#18181b"/>
    <text x="781" y="221" font-size="11" fill="#ffffff">Fixed</text>
  </g>

  <!-- Detail column -->
  <rect x="840" y="0" width="360" height="640" fill="#ffffff"/>
  <line x1="840" y1="0" x2="840" y2="640" stroke="#e4e4e7"/>

  <text x="864" y="48" font-size="18" font-weight="700" fill="#18181b">Time Out Market</text>
  <text x="1160" y="46" font-size="16" fill="#a1a1aa" text-anchor="end">×</text>

  <text x="864" y="82" font-size="11" fill="#a1a1aa">PLACE</text>
  <rect x="864" y="90" width="312" height="36" rx="8" fill="#f4f4f5"/>
  <text x="876" y="112" font-size="13" fill="#18181b">Time Out Market, Lisbon</text>

  <text x="864" y="150" font-size="11" fill="#a1a1aa">PLANNED TIME</text>
  <rect x="864" y="158" width="150" height="36" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="876" y="180" font-size="13" fill="#18181b">13:00</text>

  <rect x="864" y="212" width="312" height="54" rx="10" fill="#f4f4f5"/>
  <text x="880" y="234" font-size="13" font-weight="600" fill="#18181b">Fixed time</text>
  <text x="880" y="252" font-size="11" fill="#71717a">Keeps this time even if stops get reordered</text>
  <rect x="1112" y="228" width="40" height="22" rx="11" fill="#18181b"/>
  <circle cx="1142" cy="239" r="9" fill="#ffffff"/>

  <text x="864" y="298" font-size="11" fill="#a1a1aa">NOTES</text>
  <rect x="864" y="306" width="312" height="70" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="876" y="326" font-size="13" fill="#18181b">Reservation under "Fox" — arrive 10</text>
  <text x="876" y="344" font-size="13" fill="#18181b">minutes early.</text>

  <rect x="864" y="404" width="90" height="34" rx="8" fill="#ffffff" stroke="#d4d4d8"/>
  <text x="880" y="426" font-size="13" fill="#52525b">Remove</text>

  <!-- Annotations -->
  <text x="864" y="480" font-size="12" fill="#a1a1aa">"Fixed time" only enables once a planned time is set —</text>
  <text x="864" y="498" font-size="12" fill="#a1a1aa">an untimed item can't be "fixed" to nothing.</text>
  <text x="864" y="524" font-size="12" fill="#a1a1aa">This same toggle is what the future proximity/routing</text>
  <text x="864" y="542" font-size="12" fill="#a1a1aa">optimizer (deferred) will respect — never reshuffled.</text>
  <text x="300" y="592" font-size="12" fill="#a1a1aa">Selected item gets a solid border, matching the same selection pattern used across Trips and Check-ins.</text>
</svg>
